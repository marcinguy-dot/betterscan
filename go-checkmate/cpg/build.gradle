plugins {
    id 'java'
    id 'application'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

group = 'com.checkmate.security'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'de.fraunhofer.aisec:cpg-core:10.8.2'
    implementation 'de.fraunhofer.aisec:cpg-analysis:10.8.2'
    implementation 'de.fraunhofer.aisec:cpg-language-java:10.8.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
    implementation 'org.slf4j:slf4j-simple:2.0.18'
}

application {
    mainClass = 'com.checkmate.security.Runner'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
