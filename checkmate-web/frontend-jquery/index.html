<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard &middot; Checkmate</title>
  <link rel="stylesheet" href="vendor/bootstrap-5.3.3.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav"></div>

  <div class="page-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 fw-bold mb-0">Security Dashboard</h1>
      <button id="refreshBtn" class="btn btn-primary">Refresh</button>
    </div>

    <div id="loading" class="text-muted">Loading dashboard...</div>

    <div id="content" class="d-none">
      <!-- Stat cards -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div class="text-muted small mb-1">Total Projects</div>
            <div class="stat-value" id="statProjects">0</div>
          </div></div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div class="text-muted small mb-1">Total Scans</div>
            <div class="stat-value" id="statScans">0</div>
            <div class="text-muted small"><span id="statRunning">0</span> running</div>
          </div></div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div class="text-muted small mb-1">Total Findings</div>
            <div class="stat-value" id="statFindings">0</div>
          </div></div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100"><div class="card-body">
            <div class="text-muted small mb-1">Critical Issues</div>
            <div class="stat-value sev-critical" id="statCritical">0</div>
          </div></div>
        </div>
      </div>

      <!-- Severity breakdown -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card h-100 border-danger-subtle"><div class="card-body">
            <div class="small fw-semibold sev-critical mb-1">Critical</div>
            <div class="h4 fw-bold sev-critical mb-0" id="sevCritical">0</div>
          </div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card h-100"><div class="card-body">
            <div class="small fw-semibold sev-high mb-1">High</div>
            <div class="h4 fw-bold sev-high mb-0" id="sevHigh">0</div>
          </div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card h-100"><div class="card-body">
            <div class="small fw-semibold sev-medium mb-1">Medium</div>
            <div class="h4 fw-bold sev-medium mb-0" id="sevMedium">0</div>
          </div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card h-100"><div class="card-body">
            <div class="small fw-semibold sev-low mb-1">Low</div>
            <div class="h4 fw-bold sev-low mb-0" id="sevLow">0</div>
          </div></div>
        </div>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabScans" type="button">Recent Scans</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabDist" type="button">Severity Distribution</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabScans">
          <div class="card"><div class="card-body">
            <h2 class="h5">Recent Scans</h2>
            <p class="text-muted small">Latest security scan results</p>
            <div id="scanList" class="d-flex flex-column gap-3"></div>
          </div></div>
        </div>
        <div class="tab-pane fade" id="tabDist">
          <div class="card"><div class="card-body">
            <h2 class="h5">Severity Distribution</h2>
            <p class="text-muted small">Current vulnerability distribution</p>
            <div id="distChart"></div>
          </div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/jquery-3.7.1.min.js"></script>
  <script src="vendor/bootstrap-5.3.3.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    $(function () {
      if (!Checkmate.requireAuth()) return;
      Checkmate.renderNav("dashboard");

      function formatDuration(ms) {
        if (ms < 1000) return ms + "ms";
        if (ms < 60000) return (ms / 1000).toFixed(1) + "s";
        return (ms / 60000).toFixed(1) + "m";
      }

      function statusBadge(status) {
        return (
          '<span class="badge badge-status-' +
          Checkmate.esc(status) +
          '">' +
          Checkmate.esc(status) +
          "</span>"
        );
      }

      function renderScans(scans) {
        var $list = $("#scanList").empty();
        if (!scans || scans.length === 0) {
          $list.html('<div class="text-center text-muted py-4">No scans yet</div>');
          return;
        }
        scans.forEach(function (s) {
          var row =
            '<div class="scan-row d-flex justify-content-between align-items-center">' +
            '  <div class="flex-grow-1">' +
            '    <div class="d-flex align-items-center gap-2 mb-1">' +
            statusBadge(s.status) +
            '      <span class="text-muted small">' + Checkmate.esc(new Date(s.created_at).toLocaleString()) + "</span>" +
            "    </div>" +
            '    <div class="small"><strong>Tools:</strong> ' + Checkmate.esc(s.tools || "-") +
            '      <span class="ms-3"><strong>Strategy:</strong> ' + Checkmate.esc(s.strategy || "-") + "</span></div>" +
            '    <div class="small mt-1 d-flex gap-3">' +
            '      <span class="sev-critical">C: ' + Checkmate.esc(s.critical_count) + "</span>" +
            '      <span class="sev-high">H: ' + Checkmate.esc(s.high_count) + "</span>" +
            '      <span class="sev-medium">M: ' + Checkmate.esc(s.medium_count) + "</span>" +
            '      <span class="sev-low">L: ' + Checkmate.esc(s.low_count) + "</span>" +
            "    </div>" +
            "  </div>" +
            '  <div class="text-end">' +
            '    <div class="fw-bold">' + Checkmate.esc(s.total_issues) + " issues</div>" +
            '    <div class="text-muted small">' + Checkmate.esc(formatDuration(s.duration_ms)) + "</div>" +
            "  </div>" +
            "</div>";
          $list.append(row);
        });
      }

      function renderDistribution(stats) {
        var rows = [
          { label: "Critical", value: stats.critical_count || 0, cls: "bg-danger" },
          { label: "High", value: stats.high_count || 0, cls: "bg-warning" },
          { label: "Medium", value: stats.medium_count || 0, cls: "bg-warning-subtle text-dark" },
          { label: "Low", value: stats.low_count || 0, cls: "bg-primary" },
        ];
        var max = Math.max(1, rows[0].value, rows[1].value, rows[2].value, rows[3].value);
        var $chart = $("#distChart").empty();
        rows.forEach(function (r) {
          var pct = Math.round((r.value / max) * 100);
          $chart.append(
            '<div class="mb-3">' +
            '  <div class="d-flex justify-content-between small mb-1"><span>' + r.label + "</span><span>" + r.value + "</span></div>" +
            '  <div class="progress" style="height:1.25rem;">' +
            '    <div class="progress-bar ' + r.cls + '" style="width:' + pct + '%;"></div>' +
            "  </div>" +
            "</div>"
          );
        });
      }

      function load() {
        $("#refreshBtn").prop("disabled", true);
        $.when(
          Checkmate.api("/api/v1/dashboard/stats"),
          Checkmate.api("/api/v1/scans?limit=10")
        )
          .done(function (statsRes, scansRes) {
            var stats = statsRes[0] || {};
            var scans = scansRes[0] || [];
            $("#statProjects").text(stats.total_projects || 0);
            $("#statScans").text(stats.total_scans || 0);
            $("#statRunning").text(stats.running_scans || 0);
            $("#statFindings").text(stats.total_findings || 0);
            $("#statCritical").text(stats.critical_count || 0);
            $("#sevCritical").text(stats.critical_count || 0);
            $("#sevHigh").text(stats.high_count || 0);
            $("#sevMedium").text(stats.medium_count || 0);
            $("#sevLow").text(stats.low_count || 0);
            renderScans(scans);
            renderDistribution(stats);
            $("#loading").addClass("d-none");
            $("#content").removeClass("d-none");
          })
          .always(function () {
            $("#refreshBtn").prop("disabled", false);
          });
      }

      $("#refreshBtn").on("click", load);
      load();
    });
  </script>
</body>
</html>
