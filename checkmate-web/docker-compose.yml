version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: checkmate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkmate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: checkmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkmate-backend
    environment:
      DATABASE_URL: host=postgres user=postgres password=postgres dbname=checkmate port=5432 sslmode=disable
      REDIS_ADDR: redis:6379
      PORT: 8080
      # Signs the JWT bearer tokens issued by the backend. Replace with a strong
      # random value in production (e.g. `openssl rand -hex 32`).
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-to-a-strong-random-secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.git

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: checkmate-worker
    environment:
      DATABASE_URL: host=postgres user=postgres password=postgres dbname=checkmate port=5432 sslmode=disable
      REDIS_ADDR: redis:6379
      CHECKMATE_PATH: /app/checkmate-go/checkmate-go
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - ../go-checkmate:/app/checkmate-go
      - /tmp/checkmate-scans:/tmp/checkmate-scans

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: checkmate-frontend
    environment:
      # Browser-facing backend URL.
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # Server-side backend URL used by next-auth's credentials authorize() from
      # inside the container (localhost would resolve to the frontend itself).
      INTERNAL_API_URL: http://backend:8080
      NEXTAUTH_URL: http://localhost:3000
      # Encrypts the next-auth session cookie. Replace in production.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-change-me-to-a-strong-random-secret}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
