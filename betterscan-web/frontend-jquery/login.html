<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in &middot; BetterScan</title>
  <link rel="stylesheet" href="vendor/bootstrap-5.3.3.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="card shadow-sm" style="width:100%;max-width:28rem;">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1">Sign in to BetterScan</h1>
        <p class="text-muted text-center small mb-4">Enter your email and password to continue</p>

        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" autocomplete="email" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required />
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary w-100">Sign in</button>
        </form>

        <p class="text-muted small text-center mt-3 mb-0">
          Don't have an account?
          <a href="register.html">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script src="vendor/jquery-3.7.1.min.js"></script>
  <script src="vendor/bootstrap-5.3.3.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    $(function () {
      BetterScan.redirectIfAuthed();

      function showError(msg) {
        $("#error").text(msg).removeClass("d-none");
      }

      $("#loginForm").on("submit", function (e) {
        e.preventDefault();
        $("#error").addClass("d-none");
        var btn = $("#submitBtn").prop("disabled", true).text("Signing in...");

        BetterScan.api("/api/v1/auth/login", {
          method: "POST",
          noRedirect: true,
          body: {
            email: $("#email").val(),
            password: $("#password").val(),
          },
        })
          .done(function (data) {
            BetterScan.setSession(data.token, data.user);
            window.location.href = "index.html";
          })
          .fail(function (xhr) {
            showError(
              xhr.status === 401
                ? "Invalid email or password."
                : BetterScan.errorMessage(xhr, "Sign-in failed.")
            );
            btn.prop("disabled", false).text("Sign in");
          });
      });
    });
  </script>
</body>
</html>
