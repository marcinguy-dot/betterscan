name: Mirror to Codeberg

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror to Codeberg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "::error::CODEBERG_TOKEN secret not set"
            exit 1
          fi
          echo "Token length: ${#CODEBERG_TOKEN}"
          # Try both URL formats; Forgejo accepts token as password with any username
          git remote add codeberg "https://oauth2:${CODEBERG_TOKEN}@codeberg.org/betterscan-io/betterscan.git" 2>/dev/null || \
            git remote set-url codeberg "https://oauth2:${CODEBERG_TOKEN}@codeberg.org/betterscan-io/betterscan.git"
          git config --get remote.codeberg.url | sed 's/:[^@]*@/:***@/g' || true
          echo "Attempting push --all..."
          git push codeberg --all --force 2>&1 || {
            echo "push --all failed (exit $?), trying verbose..."
            GIT_CURL_VERBOSE=1 git push codeberg --all --force 2>&1 | sed 's/\(oauth2:\)[^@]*@/\1***@/g' | head -n 150
            exit 1
          }
          echo "Pushing tags..."
          git push codeberg --tags --force
