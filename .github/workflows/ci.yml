name: CI

on:
  push:
    branches: [main]
    paths:
      - 'betterscan-core/**'
      - 'betterscan-cli/**'
      - 'scripts/release-build.sh'
      - 'scripts/install.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'betterscan-core/**'
      - 'betterscan-cli/**'
      - 'scripts/release-build.sh'
      - 'scripts/install.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: betterscan-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterscan-core/go.mod
          cache-dependency-path: betterscan-core/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        # Integration tests install Joern/etc; keep PR CI fast with -short.
        run: go test -short ./... -count=1

  build-cli:
    name: Build CLI (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterscan-cli/go.mod
          cache-dependency-path: betterscan-cli/go.mod

      - name: Build betterscan-cli
        working-directory: betterscan-cli
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o betterscan .
          ./betterscan -h

  release-assets:
    name: Build release assets
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterscan-core/go.mod
          cache-dependency-path: betterscan-core/go.mod

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Build multi-platform binaries
        env:
          VERSION: ${{ github.sha }}
        run: |
          chmod +x scripts/release-build.sh
          ./scripts/release-build.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: betterscan-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Summarize
        run: |
          echo "### BetterScan binaries" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **betterscan-binaries** artifact from this run." >> "$GITHUB_STEP_SUMMARY"
