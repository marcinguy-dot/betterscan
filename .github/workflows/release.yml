name: Release

# Publish multi-platform CLI binaries + GitHub Release when a version tag is pushed.
# Also supports manual runs (artifacts only unless ref is a v* tag).
#
# Create a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Assets match scripts/install.sh naming:
#   betterscan_linux_amd64.tar.gz, betterscan_darwin_arm64.tar.gz, ...
#   betterscan_windows_amd64.zip, checksums.txt, SHA256SUMS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterscan-core/go.mod
          cache-dependency-path: betterscan-core/go.mod

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "dev-${GITHUB_SHA::7}")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Build multi-platform binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/release-build.sh
          ./scripts/release-build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betterscan-release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: List assets
        run: ls -lh dist/ && cat dist/checksums.txt

  release:
    name: GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: betterscan-release-${{ github.ref_name }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BetterScan ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/betterscan_*.tar.gz
            dist/betterscan_*.zip
            dist/checksums.txt
            dist/SHA256SUMS
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/betterscan-io/betterscan/main/scripts/install.sh | sh -s -- -v ${{ github.ref_name }}
            ```

            Or download a platform archive below and extract the `betterscan` binary onto your `PATH`.

            ## Checksums

            Verify downloads with `checksums.txt` / `SHA256SUMS` attached to this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish container image
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/betterscan
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: betterscan-core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
